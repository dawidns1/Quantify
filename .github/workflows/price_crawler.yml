name: Nasdaq-100 Price Crawler

on:
  schedule:
    # Run every weekday (Monday through Friday) at 22:00 UTC (around market close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Allow manual run from the GitHub Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy beautifulsoup4 requests curl_cffi lxml

    - name: Run Crawler
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PRODUCTION: "true"
      run: |
        python backend/data_fetcher.py
