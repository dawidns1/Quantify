<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuantiFi is a premium stock screening platform and multi-currency portfolio tracker, monitoring Nasdaq 100 valuations, PSG ratios, and cross-currency assets." />
    <title>QuantiFi - Portfolio Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let r of registrations) {
            r.unregister();
          }
        });
        if (window.caches) {
          caches.keys().then((names) => {
            for (let name of names) caches.delete(name);
          });
        }
      }
    </script>
  </body>
</html>
