<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuantiFi is a premium stock screening platform and multi-currency portfolio tracker, monitoring Nasdaq 100 valuations, PSG ratios, and cross-currency assets." />
    <title>QuantiFi - Portfolio Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            // Unregister any active service workers on localhost to prevent caching issues in development
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              let hasUnregistered = false;
              for (let registration of registrations) {
                registration.unregister();
                hasUnregistered = true;
              }
              if (hasUnregistered) {
                console.log('Unregistered service worker on localhost');
                window.location.reload();
              }
            });
          } else {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              console.log('ServiceWorker registered successfully with scope: ', reg.scope);
            }).catch((err) => {
              console.error('ServiceWorker registration failed: ', err);
            });
          }
        });
      }
    </script>
  </body>
</html>
